name: CI

on:
  push:
  pull_request:

jobs:
  moonbit:
    name: MoonBit check and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show MoonBit versions
        run: moon version --all

      - name: Generate package info
        run: moon info

      - name: Check packages
        run: moon check

      - name: Check packages with denied warnings
        run: moon check --deny-warn

      - name: Run tests
        run: moon test

      - name: Run tests with denied warnings
        run: moon test --deny-warn

      - name: Verify formatting
        run: moon fmt --check

